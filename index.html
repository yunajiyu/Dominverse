<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOHYUNYUMIN</title>
<script>
/* 새로고침 시 기본 화면(기본 색·문구·폰트)이 잠깐 보이는 것을 막기 위해,
   관리자 설정이 적용될 때까지 화면을 숨겼다가 부드럽게 보여줍니다. (최대 2.5초 후에는 무조건 표시) */
document.documentElement.classList.add('dv-boot');
window.dvReveal = function(){ document.documentElement.classList.remove('dv-boot'); };
setTimeout(window.dvReveal, 2500);
/* 로딩 화면: 관리자에서 등록한 로고/문구(이전 방문 때 저장해 둔 값)가 있으면 표시, 없으면 스피너 */
(function(){
  var d = document.createElement('div'); d.id = 'dvLoader';
  var c = null;
  try{ c = JSON.parse(localStorage.getItem('dv_loading') || 'null'); }catch(e){}
  if(c && (c.img || c.text)){
    if(c.img){ var im = document.createElement('img'); im.src = c.img; im.alt = ''; d.appendChild(im); }
    if(c.text){ var t = document.createElement('div'); t.textContent = c.text; d.appendChild(t); }
  } else {
    var sp = document.createElement('div'); sp.className = 'dv-spin'; d.appendChild(sp);
  }
  document.documentElement.appendChild(d);
})();
</script>
<style>
html.dv-boot body{ opacity:0; }
#dvLoader{
  position:fixed; inset:0; z-index:9999; display:none;
  grid-template-rows:1fr auto 1fr; justify-items:center;
  background:#fff; color:#2b2b31; font-family:'SUITE', system-ui, sans-serif; font-weight:700; font-size:14px; text-align:center; padding:24px;
}
#dvLoader > *{ grid-row:2; align-self:center; }
#dvLoader > img + div{ grid-row:3; align-self:start; margin-top:14px; }   /* 이미지가 있으면 이미지를 정중앙에, 문구는 그 아래 */
html.dv-boot #dvLoader{ display:grid; }
#dvLoader img{ width:auto; height:auto; max-width:min(240px, 70vw); max-height:200px; object-fit:contain; animation:dvPulse 1.4s ease-in-out infinite; }
#dvLoader .dv-spin{
  width:26px; height:26px; border:3px solid rgba(123,28,255,.18); border-top-color:#7B1CFF; border-radius:50%;
  animation:dvSpin .8s linear infinite;
}
@keyframes dvPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
@keyframes dvSpin{ to{ transform:rotate(360deg); } }
body{ transition:opacity .3s ease; }

@font-face{
  font-family:'RIDIBatang';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'SUITE';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Regular.woff2') format('woff2');
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:'SUITE';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Medium.woff2') format('woff2');
  font-weight:500; font-display:swap;
}
@font-face{
  font-family:'SUITE';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/SUITE-Bold.woff2') format('woff2');
  font-weight:700; font-display:swap;
}
:root{
  --accent:#7B1CFF;
  --accent-dim:#f1e8ff;
  --paper:#ffffff;
  --paper-dim:#f1f2f4;
  --ink:#2b2b31;
  --ink-soft:#86868f;
  --line:#d5d6dc;
  --tag-novel:#e0a233;
  --tag-gallery:#3fae8f;
  --tag-profile:#4f9fd6;
  --book-cover:#ddd0f7;
  --book-cover-border:#b39cec;
  --book-border:#c7c9d1;
  --tag-a-bg:#fdf3c4;
  --tag-b-bg:#e6dbfa;
  --tag-c-bg:#cdeaf9;
  --tag-d-bg:#fbdbe9;
  --font-main:'SUITE',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
button,input,select,textarea{ font-family:inherit; }
html{height:100%}
body{
  font-family:var(--font-main);
  color:var(--ink);
  min-height:100vh;
  position:relative;
  padding:36px 12px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* ───────── 바깥(페이지 전체) 배경 ───────── */
.page-bg{
  position:fixed; inset:0; z-index:0;
  background:#efe7da;
  background-size:cover; background-position:center;
}
.page-bg.mode-image{
  /* 블러 강도·불투명도는 관리자 > 바깥 배경에서 조절 (기본 50px / 55%) */
  inset:calc(var(--bg-blur, 50px) * -0.8);
  filter:blur(var(--bg-blur, 50px));
  opacity:var(--bg-opacity, .55);
  transform:scale(1.1);
}
.page-bg.mode-color{ filter:none; opacity:1; transform:none; }

/* ───────── 사이트 카드 (최대 800 컨테이너, 메인 영역은 항상 가운데) ───────── */
.site-row{
  display:flex; flex-direction:column; align-items:stretch; gap:22px;
  width:800px; max-width:100%; min-width:0;
  margin:auto;   /* 가로·세로 정중앙 (화면이 카드보다 작으면 안전하게 스크롤) */
  position:relative; z-index:1;
}
.book-wrap{ width:100%; height:600px; min-width:0; position:relative; }   /* 카드 크기: 가로 최대 800 × 세로 600 */
.book-wrap::before{
  content:'';
  position:absolute; top:10px; left:10px; right:-10px; bottom:-10px;
  background:var(--paper); border-radius:24px;
  box-shadow:0 20px 50px -25px rgba(30,20,10,.4);
  z-index:0;
}
.index-tabs{
  position:absolute; top:70px; left:calc(100% + 6px); z-index:5;
  display:flex; flex-direction:column; gap:8px;
}
.index-tab{
  border:none; cursor:pointer; white-space:nowrap;
  width:72px; padding:10px 6px; border-radius:0 8px 8px 0; text-align:center;
  overflow:hidden; text-overflow:ellipsis;
  font-size:12px; font-weight:700;
  background:var(--accent); color:#fff;
  box-shadow:2px 3px 8px -2px rgba(0,0,0,.25);
}
/* 메뉴(탭)별 색상 — 관리자 > 테마 설정 */
.index-tab[data-k="home"]{ background:var(--tab-home-bg, var(--accent)); color:var(--tab-home-text, #fff); }
.index-tab[data-k="profile"]{ background:var(--tab-profile-bg, var(--accent)); color:var(--tab-profile-text, #fff); }
.index-tab[data-k="novel"]{ background:var(--tab-novel-bg, var(--accent)); color:var(--tab-novel-text, #fff); }
.index-tab[data-k="commission"]{ background:var(--tab-commission-bg, var(--accent)); color:var(--tab-commission-text, #fff); }
.index-tab.active, .index-tab.active[data-k]{ background:var(--tab-active-bg, #fff); color:var(--tab-active-text, var(--ink)); border:1px solid var(--line); border-left:none; }
.book-cover{
  position:relative; z-index:1;
  background:var(--paper);
  box-shadow:0 30px 70px -30px rgba(30,20,10,.45);
  border-radius:20px;
  height:100%; display:flex; flex-direction:column;
}
.book-content{ position:relative; z-index:1; padding:12px; flex:1; min-height:0; display:flex; flex-direction:column; }
.top-bar{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:10px 18px; margin-bottom:12px; flex-shrink:0;
  font-size:11.5px; color:var(--ink-soft);
}
.top-bar b{ color:var(--ink); font-weight:700; }
.top-bar .brand-title{ font-size:17px; font-weight:700; color:var(--accent); }

.book-pages{
  display:flex; align-items:stretch; position:relative;
  flex:1; min-height:0;
}
.profile-col{
  width:200px; flex-shrink:0;
  background:var(--paper);
  border-radius:16px;
  box-shadow:0 4px 16px -8px rgba(0,0,0,.18), 0 0 0 1.5px var(--book-border);
  padding:22px 16px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
  position:relative; z-index:1;
}
.book-rings{
  width:20px;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:34px 0;
  position:absolute; top:0; bottom:0; left:200px; transform:translateX(-50%);
  z-index:2;
  pointer-events:none;
}
.book-rings span{
  width:14px; height:9px; border-radius:5px;
  background:var(--paper-dim);
  box-shadow:inset 0 0 0 1px var(--book-border), 0 1px 2px rgba(0,0,0,.15);
}
.center-col{
  flex:1; min-width:0;
  background:var(--paper);
  border-radius:16px;
  box-shadow:0 4px 16px -8px rgba(0,0,0,.18), 0 0 0 1.5px var(--book-border);
  padding:22px 20px;
  position:relative; z-index:1;
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.avatar-box{
  width:150px; height:150px; border-radius:0;
  background:var(--paper-dim); border:1px solid var(--line);
  overflow:hidden;
}
.avatar-box.has-img{ background:transparent; border-color:transparent; }
.avatar-box img{ width:100%; height:100%; object-fit:cover; display:block; }
.site-title{ font-size:15px; font-weight:700; margin-top:4px; }
.owner-tag{ font-size:11.5px; color:var(--ink-soft); }
.profile-divider{ width:70%; border-top:1px dashed var(--line); margin:6px 0; }
.profile-links{ font-size:11px; color:var(--ink-soft); }

/* ───────── 가운데: 게시판 + 메인 이미지 / 탭 콘텐츠 ───────── */
.content-section{ display:none; }
.content-section.active{ display:block; flex:1; min-height:0; overflow-y:auto; }
/* 메인화면 탭: 남는 세로 공간을 이미지(스티커) 영역이 채움 */
.content-section[data-content="main"].active{ display:flex; flex-direction:column; overflow-y:auto; }   /* 좁은 화면에서 내용이 넘치면 카드 안에서 스크롤 */
.content-section[data-content="main"] > *{ flex-shrink:0; }
.content-section[data-content="main"] > .main-image-frame{ flex:1 1 auto; min-height:200px; }

.menu-label{
  font-size:12px; color:var(--ink-soft); margin-bottom:6px;
}
.content-top{
  display:flex; gap:14px; margin-bottom:16px;
  padding-bottom:16px; border-bottom:1px dashed var(--line);
}
.content-thumb{
  width:110px; height:110px; aspect-ratio:1/1; flex-shrink:0;
  border:1px solid var(--line); border-radius:10px;
  background:var(--paper-dim);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.content-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.content-thumb .thumb-placeholder{ font-size:11px; color:var(--ink-soft); }

/* 메인 메뉴 카드: 가로로 긴 이미지 4개 + 제목, 호버 시 검은 오버레이 40% (미니 썸네일 오른쪽, 썸네일 높이에 맞춤) */
.menu-cards{
  flex:1; min-width:0; height:110px;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px;
}
.menu-card{
  position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:8px;
  min-height:0; padding:0 14px 8px; overflow:hidden;
  border:1px solid var(--line); border-radius:10px; cursor:pointer;
  background-size:cover; background-position:center; background-repeat:no-repeat;
  color:var(--ink); font:inherit; text-align:left;
}
.menu-card.menu-card.has-img{ color:#fff; }
.menu-card.has-img .mc-title, .menu-card.has-img .mc-count{ text-shadow:0 1px 4px rgba(0,0,0,.55); }
.menu-card.has-img::before{   /* 밝은 이미지에서도 제목이 읽히도록 아래쪽에 약한 그라데이션 */
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 45%, rgba(0,0,0,0) 85%);
}
.menu-card::after{
  content:''; position:absolute; inset:0; background:rgba(0,0,0,.4);
  opacity:0; transition:opacity .2s ease; pointer-events:none;
}
.menu-card:hover::after, .menu-card:focus-visible::after, .menu-card.active::after{ opacity:1; }
.mc-title, .mc-count{ position:relative; z-index:1; }
.mc-title{ font-size:14px; font-weight:700; letter-spacing:.02em; }
.mc-count{ font-size:12px; font-weight:700; opacity:.9; }
.tag-a{ background-color:var(--tag-a-bg); color:var(--tag-a-text, var(--ink)); }
.tag-b{ background-color:var(--tag-b-bg); color:var(--tag-b-text, var(--ink)); }
.tag-c{ background-color:var(--tag-c-bg); color:var(--tag-c-text, var(--ink)); }
.tag-d{ background-color:var(--tag-d-bg); color:var(--tag-d-text, var(--ink)); }

.main-image-frame{
  position:relative;
  border:1px solid var(--line); border-radius:12px; overflow:hidden;
  background:var(--paper-dim);
  min-height:260px;
}
.main-image-frame.has-img{ background-color:transparent; border-color:transparent; }
.main-image-frame img{ width:100%; display:block; }
.main-image-frame .placeholder{
  display:flex; align-items:center; justify-content:center;
  height:260px; color:var(--ink-soft); font-size:12px;
}

.today-date{ margin-top:12px; font-size:12px; color:var(--ink-soft); text-align:right; }

.sticker-layer{ position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
.sticker-item{ position:absolute; }
.sticker-item img{
  display:block; width:100%; height:auto;
  pointer-events:auto; cursor:grab; user-select:none; -webkit-user-drag:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));
}
.sticker-item img:active{ cursor:grabbing; }
.sticker-item .resize-handle{
  position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; cursor:nwse-resize;
  opacity:0; transition:opacity .15s ease; pointer-events:auto;
}
.sticker-item:hover .resize-handle{ opacity:1; }

/* 프로필 탭 */
.pill-tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.pill-tab{
  border:1px solid var(--line); background:#fff; border-radius:20px;
  padding:6px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft);
}
.pill-tab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
#profileCards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }   /* 프로필 카드는 좌우로 나란히 */
.profile-card{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; min-width:0; padding:8px 4px; }   /* 카드 테두리·배경 없음 */
.profile-card .photo{ width:100%; max-width:170px; aspect-ratio:1/1; border-radius:50%; background:var(--paper-dim); flex-shrink:0; }   /* 원형 프로필 이미지 */
#profileCommon:not(:empty){ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:14px; }
.pc-block{ border:1px solid #c7c9d1; border-radius:12px; padding:14px 16px; }   /* 요약·소개 각각 회색 테두리로 감쌈 */
.pc-block .pc-label{ display:inline-block; margin-bottom:6px; padding:3px 12px; border-radius:999px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; }
.pc-block .pc-text{ font-size:13px; line-height:1.8; color:var(--ink); white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
.profile-stats{ margin-top:10px; font-size:12px; color:var(--ink-soft); display:grid; gap:4px; }
/* 프로필 탭: 연한 회색 1px 단색 라인 (그림자 없음) */
.pill-tab, .profile-card .photo{ border:1px solid #c7c9d1; box-shadow:none; }
.pill-tab.active{ border-color:var(--accent); }

/* 소설 탭: 장르 필터 칩 + 검색 + 회차 목록 */
.nv-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.nv-chip{
  font:inherit; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line); background:#fff;
  transition:background .15s ease, color .15s ease;
}
.nv-chip:hover{ background:var(--paper-dim); }
.nv-chip.active{ background:#636a76; border-color:#636a76; color:#fff; }
.nv-search{
  width:100%; font:inherit; font-size:14px; color:var(--ink);
  padding:13px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; outline:none;
}
.nv-search::placeholder{ color:var(--ink-soft); }
.nv-search:focus{ border-color:var(--accent); }
.nv-list{ margin-top:10px; }
.nv-row{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:var(--ink);
  padding:16px 8px; border:none; border-radius:10px; background:none; cursor:pointer;
}
.nv-row:hover, .nv-row:focus-visible{ background:var(--paper-dim); outline:none; }
.nv-badge{
  flex-shrink:0; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  background:var(--b-bg); color:var(--b-fg);
}
.nv-badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--b-fg); }
.nv-title{ flex:1; min-width:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nv-tag{ flex-shrink:0; font-size:11px; color:var(--ink-soft); white-space:nowrap; }   /* 칩 없이 작은 글씨만 */
.nv-arrow{ flex-shrink:0; font-size:14px; color:var(--ink-soft); }
.nv-empty{ padding:28px 8px; text-align:center; font-size:13px; color:var(--ink-soft); }
.nv-list-view[hidden], .nv-reader-view[hidden]{ display:none; }
/* 뷰어: 헤더 카드 / 본문 패널(글꼴·크기 도구) / 이전·목록·다음 */
.nv-head, .nv-foot{ display:flex; align-items:center; gap:12px; padding:14px 18px; border:1px solid var(--line); border-radius:18px; background:#fff; }
.nv-head{ margin-bottom:12px; flex-wrap:wrap; }
.nv-back{ font:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:4px 0; }
.nv-back:hover{ color:var(--ink); }
.nv-head-title{ flex:1; min-width:0; font-size:16px; font-weight:700; }
.nv-head-meta{ flex-shrink:0; font-size:11px; color:var(--ink-soft); }
.nv-body{ position:relative; margin-bottom:12px; padding:52px 22px 24px; border-radius:18px; background:#f7f8fa; border:1px solid #eceef2; }
.nv-tools{ position:absolute; top:12px; right:12px; display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.nv-tools button{ font:inherit; font-size:13px; font-weight:700; width:34px; height:30px; color:var(--ink); background:none; border:none; cursor:pointer; }
.nv-tools button + button{ border-left:1px solid var(--line); }
.nv-tools button:hover{ background:var(--paper-dim); }
.ep-reader{ font-size:var(--nv-fs,15px); line-height:1.95; color:var(--ink); word-break:keep-all; overflow-wrap:anywhere; }
.nv-body.serif .ep-reader{ font-family:'RIDIBatang',serif; }   /* 명조: 리디바탕 (가 버튼을 눌러 실제로 쓰일 때만 내려받음) */
.nv-foot{ justify-content:space-between; padding:12px 18px; }
.nv-foot button{ font:inherit; font-size:13px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:6px 0; min-width:0; max-width:36%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nv-foot button:hover:not(:disabled){ color:var(--ink); }
.nv-foot button:disabled{ opacity:0; cursor:default; }
.nv-foot #nvToList{ color:var(--ink); font-weight:700; }

/* 그림갤러리 탭 */
.gallery-tabs{ display:flex; gap:6px; margin-bottom:14px; }
.gallery-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.gallery-grid div{ aspect-ratio:3/4; border-radius:8px; background:var(--paper-dim); position:relative; overflow:hidden; }
.gallery-grid div[data-title]::after{
  content:attr(data-title); position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:8px; text-align:center; color:#fff; font-size:12px; font-weight:700; line-height:1.35; word-break:keep-all;
  background:rgba(0,0,0,.5); opacity:0; transition:opacity .18s ease; pointer-events:none;
}

/* 갤러리 원본 이미지 팝업 */

/* ───────── 오른쪽: 사이드 패널 (기념일/BGM 전용) ─────────
   넓은 화면(1340px~): 메인 영역 바깥 오른쪽에 띄워서 메인이 중앙에 유지되도록 함
   그보다 좁으면 아래 미디어쿼리에서 메인 위쪽 가로 띠로 전환 */
.side-col{

  display:flex; flex-direction:column; gap:14px;

.side-panel{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fffefb; }

  text-align:center; padding:8px;

.bgm-widget{ padding:12px; display:flex; flex-direction:column; gap:0; color:var(--accent); background:var(--side-bgm-bg, transparent); }
/* 커버 이미지 (등록 시에만 표시) */
.bgm-cover{ width:100%; aspect-ratio:1/1; border:none; border-radius:14px; overflow:hidden; margin-bottom:10px; background:var(--accent-dim); }
.bgm-cover[hidden]{ display:none; }
.bgm-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
.bgm-title{ font-size:14px; font-weight:800; color:var(--accent); line-height:1.25; white-space:nowrap; overflow:hidden; }

/* 곡 제목이 칸보다 길면 좌우로 천천히 흐름 */
.bgm-title.marquee .in{ animation:bgmMarquee var(--mq-dur, 8s) ease-in-out infinite alternate; }
@keyframes bgmMarquee{ 0%,12%{ transform:translateX(0); } 88%,100%{ transform:translateX(var(--mq-shift, 0px)); } }

.bgm-artist{ font-size:11px; color:var(--accent); margin-top:1px; min-height:14px; }
/* 재생바·볼륨바 공통: 가는 선 + 동그란 점 (전부 테마색) */
.bgm-seek{
  -webkit-appearance:none; appearance:none; width:100%; height:14px; margin:8px 0 6px;
  background:transparent; cursor:pointer; display:block;
}
.bgm-seek::-webkit-slider-runnable-track{ height:2px; background:var(--accent); border-radius:2px; }
.bgm-seek::-moz-range-track{ height:2px; background:var(--accent); border-radius:2px; }
.bgm-seek::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; margin-top:-5px; border-radius:50%; background:var(--accent); border:none; }
.bgm-seek::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:var(--accent); border:none; }
.bgm-controls{ display:flex; align-items:center; justify-content:space-between; gap:2px; margin-top:2px; }
.bgm-controls button{
  position:relative; width:9px; height:9px; padding:0; border:none; background:transparent; color:var(--accent);
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.bgm-controls button::after{ content:''; position:absolute; inset:-8px; }   /* 눌러야 하는 영역은 넉넉하게 */
.bgm-controls button svg{ width:9px; height:9px; display:block; }
.bgm-controls button.off{ opacity:.35; }
.bgm-controls button#bgmPlayBtn{ width:17px; height:17px; border-radius:50%; background:var(--accent); color:#fff; }
.bgm-controls button#bgmPlayBtn svg{ width:7px; height:7px; }
.bgm-controls button#bgmPlayBtn::before{
  content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent);
  opacity:0; pointer-events:none;
}
.bgm-controls button#bgmPlayBtn.playing::before{ animation:bgmRing 1.6s ease-out infinite; }
@keyframes bgmRing{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(2.1); opacity:0; } }
@media (prefers-reduced-motion:reduce){ .bgm-controls button#bgmPlayBtn.playing::before{ animation:none; } }
.bgm-controls button#bgmPlayBtn .ic-pause{ display:none; }
.bgm-controls button#bgmPlayBtn.playing .ic-pause{ display:block; }
.bgm-controls button#bgmPlayBtn.playing .ic-play{ display:none; }

.anniversary-widget{ padding:12px; text-align:center; border-top:1px dashed var(--line); background:var(--side-anniv-bg, transparent); }

  .book-cover{ border-radius:16px; border:1px solid var(--book-border); box-shadow:none; overflow:hidden; }
  .book-content{ padding:0; }
  /* 모바일 메인: menu 라벨 → 바인더 고리가 달린 2×2 메뉴 → 스티커 영역 → 날짜(왼쪽) */

// 스티커가 등록된 위치 주변을 천천히 걸어다니는 효과 (잡고 끌면 멈췄다가, 놓은 자리에서 다시 시작)
// 걸어다닐 수 있는 바닥 영역 (방 이미지 1716×917 기준 좌표). 발 위치가 바닥 안에 있고 가구/문 영역 밖일 때만 이동
const WALK_MAP = {
  w:1716, h:917, pad:10,
  floor:{ x1:65, y1:240, x2:1650, y2:795 },
  blocks:[
    [78,230,180,455],     // 왼쪽 책장
    [195,222,408,588],    // 왼쪽 침대
    [428,215,705,462],    // 책상+의자
    [720,232,818,350],    // 협탁
    [835,172,940,340],    // 큰 화분
    [1160,222,1440,590],  // 오른쪽 침대
    [1432,222,1525,418],  // 기타
    [1540,230,1640,425],  // 오른쪽 책장
    [78,572,265,772],     // 왼쪽 아래 서랍장
    [1200,620,1420,765],  // 작은 테이블
    [1458,580,1620,775],  // 의자
    [750,735,965,800]     // 문
  ]
};
let walkMapOn = false;   // 스티커 영역 배경이 방 이미지(사진)일 때만 사용
function walkable(fx, fy, W, H){
  const m = WALK_MAP, sc = Math.max(W/m.w, H/m.h);
  const ix = (fx - (W - m.w*sc)/2)/sc, iy = (fy - (H - m.h*sc)/2)/sc;
  const f = m.floor;
  if(ix < f.x1 || ix > f.x2 || iy < f.y1 || iy > f.y2) return false;
  return !m.blocks.some(b=> ix > b[0]-m.pad && ix < b[2]+m.pad && iy > b[1]-m.pad && iy < b[3]+m.pad);
}
let wanderRaf = 0;
function startWander(){
  cancelAnimationFrame(wanderRaf);
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;   // 동작 줄이기 설정이면 이동은 멈추고 눈 깜빡임만 유지
  const layer = document.getElementById('stickerLayer');
  const rand = (a,b)=>a + Math.random()*(b-a);
  const states = [...layer.querySelectorAll('.sticker-item')].map(el=>{
    const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    const img = el.querySelector('img');
    const frames = (img.dataset.walk || '').split('|').filter(Boolean);
    frames.forEach(u=>{ new Image().src = u; });   // 미리 불러오기
    return { el, img, frames, bi:-1, bf:0, bt:rand(1.5,4), x, y, hx:x, hy:y, tx:null, ty:null, wait:rand(.5,2.5), phase:rand(0,6), synced:true };
  });
  if(still && !states.some(st=>st.frames.length)) return;
  // 겹침 순서는 발 위치(스티커 아래쪽)만 기준: 화면 아래에 있는 스티커가 앞에 보임
  let last = performance.now();
  function tick(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const W = layer.clientWidth, H = layer.clientHeight;
    const layerTop = layer.getBoundingClientRect().top;
    if(W && H) states.forEach(st=>{
      const el = st.el;
      el.style.zIndex = 10 + Math.round(el.getBoundingClientRect().bottom - layerTop);
      if(el.dataset.drag){ st.synced = false; return; }
      if(!st.synced){
        st.x = st.hx = parseFloat(el.style.left)/W*100; st.y = st.hy = parseFloat(el.style.top)/H*100;
        st.tx = null; st.wait = 1.5; st.synced = true;
      }
      const mx = el.offsetWidth/2/W*100, my = el.offsetHeight/2/H*100;
      const clampX = v=>Math.min(100-mx, Math.max(mx, v)), clampY = v=>Math.min(100-my, Math.max(my, v));
      let bob = 0, moving = false;
      if(still){
        /* 이동 없음 */
      } else if(st.wait > 0){
        st.wait -= dt;
      } else {
        if(st.tx === null){
          const fo = el.offsetHeight/2 - 4;   // 중심 → 발 위치 오프셋(px)
          const px = (X,Y)=>[X/100*W, Y/100*H + fo];
          const startOk = !walkMapOn || walkable(...px(st.x, st.y), W, H);
          let found = false;
          for(let i=0; i<20 && !found; i++){
            const tx = clampX(st.hx + rand(-30,30)), ty = clampY(st.hy + rand(-25,25));
            if(walkMapOn){
              if(!walkable(...px(tx,ty), W, H)) continue;
              // 가는 길에 가구가 있으면 다른 곳으로 (현재 위치가 이미 막힌 곳이면 길 검사 생략)
              let clear = true;
              for(let k=1; k<=12 && clear && startOk; k++){
                const t = k/12; clear = walkable(...px(st.x+(tx-st.x)*t, st.y+(ty-st.y)*t), W, H);
              }
              if(!clear) continue;
            }
            st.tx = tx; st.ty = ty; found = true;
          }
          if(!found){ st.wait = 1; }
        }
        if(st.tx === null) return void(el.style.left = st.x + '%', el.style.top = st.y + '%');
        const dx = (st.tx-st.x)/100*W, dy = (st.ty-st.y)/100*H, dist = Math.hypot(dx,dy);
        const step = 28*(W/520)*dt;
        if(dist <= step){ st.x = st.tx; st.y = st.ty; st.tx = null; st.wait = rand(1.5,4); }
        else { st.x += dx/dist*step/W*100; st.y += dy/dist*step/H*100; st.phase += dt*10; moving = true; bob = -Math.abs(Math.sin(st.phase))*3; }
      }
      if(!still){ el.style.left = st.x + '%'; el.style.top = st.y + '%'; }
      st.img.style.transform = bob ? `translateY(${bob.toFixed(1)}px)` : '';
      if(st.frames.length){   // 눈 깜빡임: 평소엔 기본 이미지, 2.5~5초마다 프레임을 빠르게 한 바퀴 보여주고 복귀
        if(st.bi < 0){
          st.bt -= dt;
          if(st.bt <= 0){ st.bi = 0; st.bf = .14; }
        } else {
          st.bf -= dt;
          if(st.bf <= 0){ st.bi++; st.bf = .14; if(st.bi >= st.frames.length){ st.bi = -1; st.bt = rand(2.5,5); } }
        }
        const want = st.bi >= 0 ? st.frames[st.bi] : st.img.dataset.idle;
        if(st.img.getAttribute('src') !== want) st.img.src = want;
      }
    });
    wanderRaf = requestAnimationFrame(tick);
  }
  wanderRaf = requestAnimationFrame(tick);
}

document.getElementById('stickerLayer').addEventListener('mousedown', e=>{
  const handle = e.target.closest('.resize-handle');
  const item = e.target.closest('.sticker-item');
  if(!item) return;
  if(handle){
    e.preventDefault();
    const startWidth = item.getBoundingClientRect().width;
    const startX = e.clientX;
    function onMove(e){ item.style.width = Math.max(20, startWidth + (e.clientX - startX)) + 'px'; }
    function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return;
  }
  const img = e.target.closest('img');
  if(!img) return;
  e.preventDefault();
  item.dataset.drag = '1';
  const parentRect = item.parentElement.getBoundingClientRect();
  const rect = item.getBoundingClientRect();
  let curLeft = rect.left - parentRect.left + rect.width/2;
  let curTop = rect.top - parentRect.top + rect.height/2;
  item.style.left = curLeft + 'px';
  item.style.top = curTop + 'px';
  const startX = e.clientX, startY = e.clientY;
  function onMove(e){
    item.style.left = (curLeft + e.clientX - startX) + 'px';
    item.style.top = (curTop + e.clientY - startY) + 'px';
  }
  function onUp(){ delete item.dataset.drag; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// 프로필 아래 공통 설명 2칸 (관리자 > 프로필 > 공통 설명 영역): category = summary|intro, title = 라벨, body = 내용
async function loadProfileCommon(){
  const box = document.getElementById('profileCommon');
  try{
    const rows = await dbSelect('profile_common');
    const defs = { summary:'요약', intro:'소개' };
    box.innerHTML = ['summary','intro'].map(k=>{
      const r = rows.find(x=>x.category===k);
      if(!r || !(r.body||'').trim()) return '';
      return `<div class="pc-block"><span class="pc-label">${escapeHtml((r.title||'').trim() || defs[k])}</span><div class="pc-text">${escapeHtml(r.body)}</div></div>`;
    }).join('');
  }catch(e){ box.innerHTML = ''; }
}
// 메인 프로필 카드 사진 (관리자 > 메인 화면 이미지 > ⑤ 메인 프로필 사진) — 프로필 메뉴와는 별개
async function loadMainProfile(){
  try{
    const items = await dbSelect('main_profile');
    if(items.length && items[0].image_url){
      const im = document.getElementById('avatarImg');
      im.src = items[0].image_url; im.style.display = 'block';
      im.parentElement.classList.add('has-img');
    }
  }catch(e){ /* 무시 */ }
}
async function loadProfiles(){
  await TEXT_READY;
  try{ PROFILES = await dbSelect('profile'); }catch(e){ PROFILES = []; }
  renderAuTabs();
  document.getElementById('statProfile').textContent = PROFILES.length;
}
// 버전(AU) 칩: 박도현·유민은 항상 함께 보이므로 이름 탭 없이, 같은 AU 라벨의 두 캐릭터 카드를 함께 표시
function renderAuTabs(){
  const group = document.getElementById('profileAuTabs');
  const labels = [];
  PROFILES.forEach(p=>{ const l = p.au_label || '기본'; if(!labels.includes(l)) labels.push(l); });
  if(!labels.length){
    group.innerHTML = `<button class="pill-tab active">기본</button>`;
    renderProfileCards(null);
    return;
  }
  group.innerHTML = labels.map((l,i)=>`<button class="pill-tab ${i===0?'active':''}" data-label="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join('');
  group.querySelectorAll('.pill-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      group.querySelectorAll('.pill-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderProfileCards(btn.dataset.label);
    });
  });
  renderProfileCards(labels[0]);
}
function renderProfileCards(label){
  const wrap = document.getElementById('profileCards');
  const list = label === null ? [] : PROFILES.filter(p=>(p.au_label||'기본')===label);
  if(!list.length){
    wrap.innerHTML = `<div class="profile-card"><div class="photo"></div><div><p>${escapeHtml(t('profile_empty','관리자에서 프로필을 등록하면 이곳에 표시됩니다.'))}</p></div></div>`;
    return;
  }
  wrap.innerHTML = list.map(item=>{
    const stats = (item.body||'').split('\n').filter(Boolean).map(l=>`<span>${escapeHtml(l)}</span>`).join('');
    return `<div class="profile-card">
      <div class="photo" style="${bgStyle(item.image_url)}"></div>
      <div><b>${escapeHtml(item.character)}</b><p>${escapeHtml(item.summary||'')}</p><div class="profile-stats">${stats}</div></div>
    </div>`;
  }).join('');
}

let NOVELS = [];
let NV_GENRE = '';     // '' = 전체
const NV_PALETTE = [['#fff1c2','#d99a00'],['#d3f5e6','#17a37a'],['#dbe8ff','#3b73f0'],['#f1e2ff','#9a4be0'],['#ffe0e6','#e0446a'],['#e4e6ea','#6b7280']];
function nvGenreOf(n){ return (n.category||'').trim(); }
function nvGenres(){ return [...new Set(NOVELS.map(nvGenreOf).filter(Boolean))]; }
let NV_TAG_COLORS = {};   // 관리자에서 지정한 태그 글자색 (section 'novel_tag': category = 태그 문구('*' = 모든 태그), image_url = 색상)
let NV_COLORS = {};   // 관리자에서 지정한 장르별 배지 색 (section 'novel_genre': category = 장르, image_url = 색상)
function nvBadge(n){
  const g = nvGenreOf(n);
  if(!g) return `<span class="nv-badge" style="--b-bg:#e4e6ea;--b-fg:#6b7280">기타</span>`;   // 장르 미지정: 줄 맞춤용 회색 배지
  const custom = NV_COLORS[g];
  if(custom) return `<span class="nv-badge" style="--b-fg:${escapeHtml(custom)};--b-bg:color-mix(in srgb, ${escapeHtml(custom)} 18%, #fff)">${escapeHtml(g)}</span>`;
  const c = NV_PALETTE[nvGenres().indexOf(g) % NV_PALETTE.length];
  return `<span class="nv-badge" style="--b-bg:${c[0]};--b-fg:${c[1]}">${escapeHtml(g)}</span>`;
}
// 목록 오른쪽 태그: 관리자에서 입력한 태그(예: 3화, 외전, 프롤로그) → 없으면 회차 번호 + '화'
function nvTag(n){ return (n.summary||'').trim() || (n.episode_no ? n.episode_no+'화' : ''); }
function nvTagColor(tag){ return NV_TAG_COLORS[tag] || NV_TAG_COLORS['*'] || ''; }
function nvTitle(n){ return n.title||'제목 미정'; }
function renderNvChips(){
  const box = document.getElementById('nvChips');
  const gs = nvGenres();
  box.hidden = gs.length < 1;
  box.innerHTML = [''].concat(gs).map(g=>`<button type="button" class="nv-chip${g===NV_GENRE?' active':''}" data-genre="${escapeHtml(g)}">${escapeHtml(g||t('novel_all','전체'))}</button>`).join('');
}
function renderNvList(){
  const q = document.getElementById('nvSearch').value.trim().toLowerCase();
  const list = document.getElementById('nvList');
  if(!NOVELS.length){ list.innerHTML = `<div class="nv-empty">${escapeHtml(t('novel_empty','등록된 회차가 없습니다'))}</div>`; return; }
  const items = NOVELS.filter(n=>(!NV_GENRE || nvGenreOf(n)===NV_GENRE) && (!q || (n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q)));
  list.innerHTML = items.length
    ? items.map(n=>`<button type="button" class="nv-row" data-id="${n.id}">${nvBadge(n)}<span class="nv-title">${escapeHtml(nvTitle(n))}</span>${nvTag(n)?`<span class="nv-tag"${nvTagColor(nvTag(n))?` style="color:${escapeHtml(nvTagColor(nvTag(n)))}"`:''}>${escapeHtml(nvTag(n))}</span>`:''}<span class="nv-arrow" aria-hidden="true">→</span></button>`).join('')
    : `<div class="nv-empty">검색 결과가 없습니다</div>`;
}
let NV_SEQ = [], NV_CUR = -1, NV_FS = 15;
try{ const v = parseInt(localStorage.getItem('nvFs'),10); if(v>=12 && v<=24) NV_FS = v; }catch(e){}
function applyNvFs(){ document.getElementById('nvBody').style.setProperty('--nv-fs', NV_FS+'px'); try{ localStorage.setItem('nvFs', NV_FS); }catch(e){} }
function showNvReader(n){
  // 이전/다음은 현재 필터·검색 결과 순서를 따름
  const q = document.getElementById('nvSearch').value.trim().toLowerCase();
  NV_SEQ = NOVELS.filter(x=>(!NV_GENRE || nvGenreOf(x)===NV_GENRE) && (!q || (x.title||'').toLowerCase().includes(q) || (x.body||'').toLowerCase().includes(q)));
  NV_CUR = NV_SEQ.findIndex(x=>x.id===n.id);
  if(NV_CUR < 0){ NV_SEQ = NOVELS.slice(); NV_CUR = NV_SEQ.findIndex(x=>x.id===n.id); }
  document.getElementById('nvHeadTitle').textContent = nvTitle(n);
  document.getElementById('nvHeadMeta').innerHTML = nvBadge(n);
  document.getElementById('epReader').innerHTML = escapeHtml(n.body||'').replace(/\n/g,'<br>');
  const pv = NV_SEQ[NV_CUR-1], nx = NV_SEQ[NV_CUR+1];
  const bp = document.getElementById('nvPrev'), bn = document.getElementById('nvNext');
  bp.disabled = !pv; bp.textContent = pv ? '‹ '+nvTitle(pv) : '';
  bn.disabled = !nx; bn.textContent = nx ? nvTitle(nx)+' ›' : '';
  applyNvFs();
  document.getElementById('nvListView').hidden = true;
  document.getElementById('nvReaderView').hidden = false;
  const sec = document.querySelector('.content-section[data-content="novel"]'); if(sec) sec.scrollTop = 0;
}
function showNvList(){
  document.getElementById('nvReaderView').hidden = true;
  document.getElementById('nvListView').hidden = false;
}
document.getElementById('nvChips').addEventListener('click', e=>{
  const b = e.target.closest('.nv-chip'); if(!b) return;
  NV_GENRE = b.dataset.genre; renderNvChips(); renderNvList();
});
document.getElementById('nvSearch').addEventListener('input', renderNvList);
document.getElementById('nvList').addEventListener('click', e=>{
  const r = e.target.closest('.nv-row'); if(!r) return;
  const n = NOVELS.find(x=>String(x.id)===r.dataset.id); if(n) showNvReader(n);
});
document.getElementById('nvBack').addEventListener('click', showNvList);
document.getElementById('nvToList').addEventListener('click', showNvList);
document.getElementById('nvPrev').addEventListener('click', ()=>{ if(NV_SEQ[NV_CUR-1]) showNvReader(NV_SEQ[NV_CUR-1]); });
document.getElementById('nvNext').addEventListener('click', ()=>{ if(NV_SEQ[NV_CUR+1]) showNvReader(NV_SEQ[NV_CUR+1]); });
document.getElementById('nvFont').addEventListener('click', ()=>document.getElementById('nvBody').classList.toggle('serif'));
document.getElementById('nvSmaller').addEventListener('click', ()=>{ NV_FS = Math.max(12, NV_FS-1); applyNvFs(); });
document.getElementById('nvLarger').addEventListener('click', ()=>{ NV_FS = Math.min(24, NV_FS+1); applyNvFs(); });
async function loadNovel(){

let GALLERY = [];

}
// 묶음 이미지: 대표(image_url) + 추가 이미지(body에 한 줄에 하나씩)
function galleryImages(it){
  const list = [];
  if(it.image_url) list.push(it.image_url);
  String(it.body||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>/^(https?:|\/|data:)/i.test(x)).forEach(x=>list.push(x));
  return list;
}
let CUR_ITEMS = [];
function renderGalleryGrid(){
  const grid = document.getElementById('galleryGrid');
  const items = GALLERY.filter(g=>g.category===activeCat);
  CUR_ITEMS = items;
  grid.innerHTML = items.length
    ? items.map((it,i) => { const n = galleryImages(it).length; return `<div data-url="${escapeHtml(it.image_url||'')}" data-i="${i}"${it.title?` data-title="${escapeHtml(it.title)}"`:''} style="${bgStyle(it.image_url)}">${n>1?`<span class="multi-badge">+${n-1}</span>`:''}</div>`; }).join('')
    : `<div></div><div></div><div></div>`;
}
document.querySelectorAll('#galleryTabs .pill-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#galleryTabs .pill-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    renderGalleryGrid();
  });
});

// ── 갤러리 그림 클릭 → 원본 이미지 팝업 (그림 클릭: 실제 픽셀 크기 ↔ 화면에 맞춤 전환)
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
let lbList = [], lbIdx = 0;
function showLb(){
  lbImg.src = lbList[lbIdx];
  const multi = lbList.length > 1;
  document.getElementById('lbPrev').hidden = !multi;
  document.getElementById('lbNext').hidden = !multi;
  const c = document.getElementById('lbCount'); c.hidden = !multi; c.textContent = (lbIdx+1) + ' / ' + lbList.length;
}
function openLightbox(list, start){
  lbList = Array.isArray(list) ? list.filter(Boolean) : (list ? [list] : []);
  if(!lbList.length) return;
  lbIdx = start || 0;
  showLb();
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
}
function lbMove(d){
  if(lbList.length < 2) return;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  showLb();
}
function closeLightbox(){
  lightbox.hidden = true;
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
}
document.getElementById('galleryGrid').addEventListener('click', e=>{
  const d = e.target.closest('[data-url]');
  if(!d) return;
  const it = CUR_ITEMS[+d.dataset.i];
  openLightbox(it ? galleryImages(it) : d.dataset.url, 0);
});
document.getElementById('lbPrev').addEventListener('click', ()=>lbMove(-1));
document.getElementById('lbNext').addEventListener('click', ()=>lbMove(1));
// 터치: 좌우로 밀어서 넘기기
let lbTouchX = null;
lightbox.addEventListener('touchstart', e=>{ lbTouchX = e.touches[0].clientX; }, {passive:true});
lightbox.addEventListener('touchend', e=>{
  if(lbTouchX === null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX; lbTouchX = null;
  if(Math.abs(dx) > 50) lbMove(dx < 0 ? 1 : -1);
}, {passive:true});
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e=>{
  if(lightbox.hidden) return;
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowLeft') lbMove(-1);
  else if(e.key==='ArrowRight') lbMove(1);
});

async function loadTheme(){
  try{
    const items = await dbSelect('site_theme');
    const map = {};
    items.forEach(it=>{ if(it.category) map[it.category] = it.image_url; });
    const root = document.documentElement.style;
    if(map.accent) root.setProperty('--accent', map.accent);
    if(map.tag_a) root.setProperty('--tag-a-bg', map.tag_a);
    if(map.tag_b) root.setProperty('--tag-b-bg', map.tag_b);
    if(map.tag_c) root.setProperty('--tag-c-bg', map.tag_c);
    if(map.tag_d) root.setProperty('--tag-d-bg', map.tag_d);
    ['a','b','c','d'].forEach(x=>{ if(map['chip_text_'+x]) root.setProperty('--tag-'+x+'-text', map['chip_text_'+x]); });
    ['home','profile','novel','commission'].forEach(k=>{
      if(map['tab_'+k]) root.setProperty('--tab-'+k+'-bg', map['tab_'+k]);
      if(map['tab_text_'+k]) root.setProperty('--tab-'+k+'-text', map['tab_text_'+k]);
    });
    if(map.side_bgm_bg) root.setProperty('--side-bgm-bg', map.side_bgm_bg);
    if(map.side_anniv_bg) root.setProperty('--side-anniv-bg', map.side_anniv_bg);
    ['main','profile','novel','gallery'].forEach(k=>{
      if(map['mtab_'+k]) root.setProperty('--mtab-'+k+'-bg', map['mtab_'+k]);
      if(map['mtab_text_'+k]) root.setProperty('--mtab-'+k+'-text', map['mtab_text_'+k]);
    });
    if(map.tab_active) root.setProperty('--tab-active-bg', map.tab_active);
    if(map.tab_active_text) root.setProperty('--tab-active-text', map.tab_active_text);
  }catch(e){ /* 무시 */ }
}

// ══════════════════════════════════════
//  BGM
// ══════════════════════════════════════
function setBgmTitle(text){
  const el = document.getElementById('bgmTitle');
  el.classList.remove('marquee');
  el.innerHTML = '';
  const sp = document.createElement('span'); sp.className = 'in'; sp.textContent = text;
  el.appendChild(sp);
  updateBgmMarquee();
}
function updateBgmMarquee(){
  const el = document.getElementById('bgmTitle'); const sp = el.querySelector('.in');
  if(!sp) return;
  el.classList.remove('marquee');
  if(!el.clientWidth) return;                       // 숨겨진 상태면 건너뜀
  const shift = sp.scrollWidth - el.clientWidth;
  if(shift > 2){
    el.style.setProperty('--mq-shift', (-shift)+'px');
    el.style.setProperty('--mq-dur', Math.max(6, shift/20 + 4)+'s');
    el.classList.add('marquee');
  }
}
window.addEventListener('resize', updateBgmMarquee);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateBgmMarquee);
async function loadBGM(){
  await TEXT_READY;
  try{
    let globalCover = '';
    try{
      const cv = await dbSelect('bgm_cover');
      if(cv.length && cv[0].image_url) globalCover = cv[0].image_url;
    }catch(e){ /* 커버 없음 */ }
    const all = await dbSelect('site_bgm');
    const tracks = all.filter(x=>x.image_url);
    if(!tracks.length){
      setBgmTitle(t('bgm_empty','등록된 곡이 없습니다'));
      if(globalCover){ const ci = document.getElementById('bgmCoverImg'); ci.src = globalCover; ci.style.display = 'block'; }
      return;
    }
    const audio = document.getElementById('bgmAudio');
    const btn = document.getElementById('bgmPlayBtn');
    const seek = document.getElementById('bgmSeek');
    const rep = document.getElementById('bgmRepeat');
    const shuf = document.getElementById('bgmShuffle');
    audio.volume = 0.6; audio.loop = false;
    let idx = 0, repeatAll = true, shuffle = false, dragging = false;
    const isUrl = v => /^(https?:|\/|data:)/i.test(String(v||'').trim());

    function loadTrack(i, autoplay){
      idx = (i + tracks.length) % tracks.length;
      const it = tracks[idx];
      setBgmTitle(it.title || '제목 미상');
      document.getElementById('bgmArtist').textContent = it.summary || '';
      const cover = isUrl(it.body) ? it.body.trim() : globalCover;   // 곡별 커버 → 없으면 공통 커버
      const cimg = document.getElementById('bgmCoverImg'), cbox = document.getElementById('bgmCover');
      if(cover){ cimg.src = cover; cimg.style.display = 'block'; } else { cimg.removeAttribute('src'); cimg.style.display = 'none'; }
      audio.src = it.image_url;
      seek.value = 0;
      if(autoplay) audio.play().catch(()=>{});
    }
    function nextIndex(){
      if(shuffle && tracks.length > 1){
        let j; do{ j = Math.floor(Math.random()*tracks.length); }while(j === idx);
        return j;
      }
      return idx + 1;
    }
    function goNext(auto){
      const n = nextIndex();
      if(n >= tracks.length && !shuffle && !repeatAll && auto){   // 반복 꺼짐: 마지막 곡이 끝나면 정지
        loadTrack(0, false); return;
      }
      loadTrack(n, true);
    }
    function goPrev(){
      if(audio.currentTime > 3){ audio.currentTime = 0; return; }
      loadTrack(idx - 1, true);
    }
    loadTrack(0, false);

    const setPlaying = on => btn.classList.toggle('playing', on);
    btn.addEventListener('click', ()=>{ if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); } });
    audio.addEventListener('play',  ()=>setPlaying(true));
    audio.addEventListener('pause', ()=>setPlaying(false));
    audio.addEventListener('ended', ()=>goNext(true));
    audio.addEventListener('timeupdate', ()=>{
      if(!dragging && audio.duration) seek.value = Math.round(audio.currentTime / audio.duration * 1000);
    });
    seek.addEventListener('input', ()=>{ dragging = true; });
    seek.addEventListener('change', ()=>{
      if(audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
      dragging = false;
    });
    document.getElementById('bgmPrev').addEventListener('click', goPrev);
    document.getElementById('bgmNext').addEventListener('click', ()=>goNext(false));
    rep.classList.toggle('off', !repeatAll);
    rep.addEventListener('click', ()=>{ repeatAll = !repeatAll; rep.classList.toggle('off', !repeatAll); });
    shuf.classList.toggle('off', !shuffle);
    shuf.addEventListener('click', ()=>{ shuffle = !shuffle; shuf.classList.toggle('off', !shuffle); });
  }catch(e){ /* 무시 */ }
}

const FONT_PRESETS = {
  'Noto Sans KR':'wght@400;500;700', 'Noto Serif KR':'wght@400;700',
  'Nanum Gothic':'wght@400;700', 'Nanum Myeongjo':'wght@400;700',
  'Gowun Batang':'wght@400;700', 'Gowun Dodum':'',
  'IBM Plex Sans KR':'wght@400;500;700', 'Gothic A1':'wght@400;500;700',
  'Black Han Sans':'', 'Jua':'', 'Do Hyeon':'', 'Song Myung':'', 'Hi Melody':'', 'Yeon Sung':''
};
async function loadFont(){
  try{
    const items = await dbSelect('site_font');
    if(!items.length) return;
    const it = items[0];
    const name = String(it.title||'').replace(/["'\\<>]/g,'').trim();
    if(!name) return;
    const cat = it.category || 'preset';
    const url = (it.image_url||'').trim();
    let loaded = Promise.resolve();
    const wait = el => new Promise(res=>{ el.onload = res; el.onerror = res; setTimeout(res, 2000); });
    if(cat==='preset'){
      const spec = FONT_PRESETS[name];
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family='+encodeURIComponent(name).replace(/%20/g,'+')+(spec?':'+spec:'')+'&display=swap';
      loaded = wait(l);
      document.head.appendChild(l);
    } else if(cat==='css' && url){
      const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = url;
      loaded = wait(l);
      document.head.appendChild(l);
    } else if(cat==='file' && url){
      const st = document.createElement('style');
      st.textContent = `@font-face{font-family:"${name}";src:url("${url.replace(/"/g,'%22')}");font-weight:100 900;font-display:swap;}`;
      document.head.appendChild(st);
    } else { return; }
    document.documentElement.style.setProperty('--font-main', `"${name}", 'SUITE', sans-serif`);
    await loaded;
    try{ await Promise.race([ document.fonts.load(`700 14px "${name}"`), new Promise(r=>setTimeout(r,1500)) ]); }catch(e){}
  }catch(e){ /* 무시 */ }
}

// ══════════════════════════════════════
//  기념일
// ══════════════════════════════════════
async function loadAnniversary(){
  await TEXT_READY;
  try{
    const items = await dbSelect('anniversary');
    if(!items.length) return;
    const it = items[0];
    if(it.title) document.getElementById('annivLabel').textContent = it.title;
    if(it.body){
      const start = new Date(it.body);
      if(!isNaN(start)){
        const days = Math.floor((Date.now() - start.getTime()) / 86400000) + 1;
        document.getElementById('annivDays').textContent = days + t('anniv_suffix','일째');
      }
    }
  }catch(e){ /* 무시 */ }
}

async function loadLoadingLogo(){
  try{
    const items = await dbSelect('loading_logo');
    const it = items[0];
    if(it && (it.image_url || it.title)) localStorage.setItem('dv_loading', JSON.stringify({ img: it.image_url||'', text: it.title||'' }));
    else localStorage.removeItem('dv_loading');
  }catch(e){ /* 무시 */ }
}

try{ if(localStorage.getItem('dv_admin_authed') === 'yes'){ const w = document.getElementById('writeBtn'); if(w) w.hidden = false; } }catch(e){}
const BOOT_TASKS = [

  loadPageBackground(), loadMainImage(), loadStickerBg(), loadMenuThumb(), loadMenuCards(),
  loadStickers(), loadContentTop(), loadProfiles(), loadProfileCommon(), loadNovel(), loadGallery(),
  loadBGM(), loadAnniversary(), loadTheme(), loadFont(), TEXT_READY
];

Promise.allSettled(BOOT_TASKS).then(()=>{ requestAnimationFrame(()=>window.dvReveal && window.dvReveal()); });
